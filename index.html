<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MHM Productions · Client Docs</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--red:#ef2600;--ink:#272222;--paper:#ece5d6;}
@media (prefers-color-scheme:dark){:root{--ink:#ece5d6;--paper:#272222;}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font:16px/1.5 Rubik,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
main{max-width:34rem;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--red);margin:0 auto 18px}
h1{font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 .6rem}
p{margin:0;opacity:.8}
a{color:var(--red)}
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>MHM Productions · Client Docs</h1>
  <p>Documentation for MHM Productions clients. If you were sent a link, use that link. Otherwise, <a href="https://mhmproductions.com">mhmproductions.com</a>.</p>
</main>
</body>
</html>
